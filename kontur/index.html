<title>Контур · Telegram Mini App</title>
<script>
'use strict';
const appTheme=(()=>{
 const storageKey='kontur-mini-ui-theme';
 const media=window.matchMedia('(prefers-color-scheme: dark)');
 const colors={
  light:{background:'#f0f2f7',chrome:'#f6f7fc'},
  dark:{background:'#141925',chrome:'#181f2e'},
 };
 let preference='auto';
 let telegram=null;
 const fromLaunch=launchTheme();
 function launchTheme(){
  try{
   const params=new URLSearchParams(location.hash.slice(1));
   const color=JSON.parse(params.get('tgWebAppThemeParams')||'null')?.bg_color;
   if(!/^#[a-f0-9]{6}$/i.test(color||''))return null;
   const [r,g,b]=color.slice(1).match(/../g).map(unit=>Number.parseInt(unit,16));
   return Math.hypot(r*Math.sqrt(.299),g*Math.sqrt(.587),b*Math.sqrt(.114))<120?'dark':'light';
  }catch{return null;}
 }
 try{
  const saved=localStorage.getItem(storageKey);
  if(saved==='light'||saved==='dark')preference=saved;
 }catch{}
 function resolved(){
  if(preference!=='auto')return preference;
  if(telegram?.colorScheme==='dark'||telegram?.colorScheme==='light')return telegram.colorScheme;
  return fromLaunch||(media.matches?'dark':'light');
 }
 function apply(){
  const theme=resolved();
  const {background,chrome}=colors[theme];
  document.documentElement.dataset.theme=theme;
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content',background);
  if(!telegram?.isVersionAtLeast)return;
  for(const [version,method,value] of [
   ['6.1','setBackgroundColor',background],
   ['6.9','setHeaderColor',chrome],
   ['7.10','setBottomBarColor',chrome],
  ]){
   if(telegram.isVersionAtLeast(version)){
    try{telegram[method]?.(value);}catch{}
   }
  }
 }
 function select(value){
  if(!['auto','light','dark'].includes(value))return;
  preference=value;
  try{localStorage.setItem(storageKey,preference);}catch{}
  apply();
 }
 function connect(client){
  telegram=client;
  telegram.onEvent?.('themeChanged',apply);
  apply();
 }
 if(media.addEventListener)media.addEventListener('change',apply);
 else media.addListener?.(apply);
 apply();
 return {connect,select,get preference(){return preference;}};
})();

</script>

/* Subdued light and dark palettes share the same component hierarchy. */
:root{

 --action:#365bb4;--action-hover:#2e4d98;--action-ink:#fff;--link:#3456a5;
 --good-bg:#e1f0ee;--good-ink:#265b56;--warn-bg:#f3ebdb;--warn-ink:#745320;
 --bad-bg:#f6e5e9;--bad-ink:#89394d;--neutral-bg:#e9edf4;--neutral-ink:#4d5a73;
 --amber:#91621f;--scrim-color:#10192d63;--toast-bg:#293653;--toast-ink:#f3f6ff;
 --toast-btn:#3b4d72;--toast-line:#6c7e9e;--map-grid:#ccd6e9;--map-soft:#e0e8f8;
 --shadow:0 14px 46px #15254926;
}
:root[data-theme="dark"]{
 color-scheme:dark;

 --ink:#ebedf6;--muted:#b1bbd1;--line:#343f55;--control-line:#7887a7;
 --soft:#293a61;--purple:#a5b9ff;--menu-ink:#c6d4ff;--focus:#a6b9ff;
 --action:#a8baff;--action-hover:#bbc9ff;--action-ink:#17244a;--link:#bdccff;
 --good-bg:#263e40;--good-ink:#a9d9d1;--warn-bg:#423525;--warn-ink:#f0cea0;
 --bad-bg:#482d3a;--bad-ink:#f1bbc9;--neutral-bg:#2c3548;--neutral-ink:#c0cbdf;
 --amber:#e6c18c;--scrim-color:#080d18c4;--toast-bg:#2b3b5c;--toast-ink:#edf2ff;
 --toast-btn:#3a4a70;--toast-line:#7185ad;--map-grid:#425375;--map-soft:#273756;
 --shadow:0 14px 46px #070b137a;

.app-navigation button:focus-visible,.btn:focus-visible,.chip:focus-visible,summary:focus-visible,a:focus-visible,input:focus,select:focus,textarea:focus{outline-color:var(--focus)}
.btn,.chip,.work-tools .btn{background:var(--paper);border-color:var(--line);color:var(--ink)}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--action-ink)}

.search-card,.place,.sheet,.dialog,.drawer,.timeline article,.filter-panel{background:var(--paper);border-color:var(--line)}

 ['competition','Конкуренты и аналоги','Сравните 1–3 страницы: что они объясняют, как записывают или принимают заказ.'],
 ['opportunity','Что именно улучшит сайт','Какую проблему посетителя решаем и что предлагаем сделать первым.'],
 ['publicCopy','Проверенный текст о заведении','Только факты, которые можно показать посетителю. Этот текст попадёт на сайт.'],
 ['unknown','Что осталось выяснить','Укажите неподтверждённые цены, часы, фото или другие пробелы.'],
];
const workflow=(()=>{
 const string=(value,n)=>typeof value==='string'?value.trim().slice(0,n):'';
 function https(value){
  try{
   const u=new URL(string(value,2500));
   return u.protocol==='https:'&&u.hostname.includes('.')&&!u.username&&!u.password?u.href:'';
  }catch{return '';}
 }
 function yandexPlace(value){
  const link=https(value);
  if(!link)return '';
  const url=new URL(link);
  if(url.origin!=='https://yandex.ru'||!/^\/maps\/(?:\d+\/[^/]+\/)?org\/(?:[^/]+\/)?\d+\/?$/.test(url.pathname))return '';
  return url.origin+url.pathname.replace(/\/?$/,'/');
 }
 function venuePhoto(value){
  const href=https(value);
  if(!href)return '';
  const url=new URL(href);
  return url.hostname==='avatars.mds.yandex.net'&&/^\/get-altay\/\d+\/[a-z\d]+\/[a-z_]+$/i.test(url.pathname)?url.origin+url.pathname:'';
 }
 const ownerField=(field,message)=>Object.assign(new Error(message),{field});
 function owner(card,b){
  if(card.fixture&&b.sample===true)return {name:'Алексей (учебный контакт)',channel:'test',href:'#test-chat',source:'',checkedAt:new Date().toISOString()};
  if(card.fixture)throw new Error('Используйте учебный контакт или добавьте реальное заведение вручную.');
  const scope=b.scope==='venue'?'venue':'person';
  const name=string(scope==='venue'?card.name:b.name,140), source=https(b.source), channel=b.channel;
  if(!name)throw ownerField('name','Укажите имя или ФИО из источника.');
  if(!source)throw ownerField('source','Укажите полный HTTPS-адрес публичной страницы.');
  let href='';
  const value=string(b.contact,500);
  if(channel==='telegram'){
   const username=value.replace(/^@/,'');
   if(/^[a-z][a-z0-9_]{3,31}$/i.test(username))href='https://t.me/'+username;
   else{
    const url=https(value);
    if(url){
     const u=new URL(url);
     if(u.hostname==='t.me'&&/^\/(?:[a-z][a-z0-9_]{3,31}|m\/[a-z0-9_-]+)\/?$/i.test(u.pathname)&&!u.search&&!u.hash)href=u.origin+u.pathname;
    }
   }
  }
  if(channel==='whatsapp'){
   const link=https(value);
   const u=link?new URL(link):null;
   const raw=u?.hostname==='wa.me'?u.pathname.slice(1).replace(/\/$/,''):u?.hostname==='api.whatsapp.com'&&u.pathname==='/send'?u.searchParams.get('phone'):value;
   let n=String(raw||'').replace(/[()\s+\p{Pd}]/gu,'');
   if(/^8[3489]\d{9}$/.test(n))n='7'+n.slice(1);
   if(/^[1-9][0-9]{7,14}$/.test(n))href='https://wa.me/'+n;
  }
  if(channel==='vk'){
   const link=https(value);
   const u=link?new URL(link):null;
   if(u&&['vk.com','vk.ru','vk.me'].includes(u.hostname)&&/^\/[a-z0-9_.-]+\/?$/i.test(u.pathname)&&
      !/^\/(?:help|feed|wall[-\d_]+|share|login|search|video[-\d_]+)\/?$/i.test(u.pathname))href=u.origin+u.pathname;
  }
  if(channel==='max'&&scope==='venue'){
   const link=https(value);
   const u=link?new URL(link):null;
   if(u?.hostname==='max.ru'&&/^\/(?:(?:u|j)\/)?[a-z\d_-]+\/?$/i.test(u.pathname)&&
      !/^\/(?:help|feed|share|login|search)\/?$/i.test(u.pathname))href=u.origin+u.pathname;
  }
  if(channel==='email'&&/^[a-z0-9._+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i.test(value))href='mailto:'+value;
  if(!href)throw ownerField('contact','Укажите рабочий контакт в формате выбранного канала.');
  if(b.confirmed!==true)throw ownerField('confirmed','Сверьте контакт с источником и отметьте подтверждение.');
  const photo=https(b.photo),photoSource=https(b.photoSource);
  return {name,channel,href,source,checkedAt:new Date().toISOString(),...(scope==='venue'?{scope}:{}),...(photo&&photoSource?{photo,photoSource}:{})};
 }
 function analysis(card,b){
  const result=Object.fromEntries(researchFields.map(([key])=>[key,string(b[key],key==='publicCopy'?1000:2200)]));
  result.verifiedItems=string(b.verifiedItems,1800);
  result.cta=string(b.cta,65);
  result.target=b.target==='menu'?'menu':'contacts';
  result.sources=String(b.sources||'').split(/\n/).map(https).filter(Boolean).slice(0,12);
  if(researchFields.filter(([key])=>key!=='unknown').some(([key])=>!result[key])||!result.cta)
   throw new Error('Заполните аудиторию, предложение, онлайн-присутствие, сравнение, цель сайта, проверенный текст и кнопку.');
  if(!result.sources.length)throw new Error('Добавьте хотя бы одну HTTPS-ссылку на источник фактов.');
  return result;
 }
 function sampleAnalysis(){
  return {
   audience:'Учебный сценарий: гости с телефона хотят быстро увидеть меню, формат и расположение пиццерии.',
   offer:'Демо пиццерии с отдельной страницей для просмотра меню. Позиции и цены в шаблоне приведены как примеры.',
   presence:'Учебная карточка показывает сайт сети и отсутствие страницы точки.',
   competition:'Учебное сравнение: каталог удобен для поиска, а отдельная страница показывает меню и адрес одной точки.',
   opportunity:'Показать короткое меню и адрес на одном экране, чтобы гость мог быстро решить, посетить ли заведение.',
   publicCopy:'PizzaSun — демонстрационный пример страницы пиццерии в Иркутске.',
   unknown:'Настоящее меню, часы работы и адрес следует проверить до коммерческой публикации.',
   cta:'Смотреть меню',target:'menu',sources:'https://example.org/',
  };
 }
 function key(card){
  if(!card.owner||!card.analysis)return '';
  return JSON.stringify([card.owner.checkedAt,card.analysis]);
 }
 function requireAnalysis(card){
  if(!card.owner)throw new Error('Сначала подтвердите контакт владельца.');
  if(!card.analysis)throw new Error('Сначала сохраните анализ этого заведения.');
  return card.analysis;
 }
 function prompt(card){
  const a=requireAnalysis(card);
  return [
   'Собери адаптивный демосайт для «'+card.name+'» ('+card.category+', '+card.city+').',
   ...researchFields.filter(([k])=>a[k]).map(([k,label])=>label+'\n'+a[k]),
   ...(a.verifiedItems?['Проверенные позиции\n'+a.verifiedItems]:[]),
   'Источники\n'+a.sources.join('\n'),
   'Первое действие: «'+a.cta+'». Веди на '+(a.target==='menu'?'блок меню':'блок контактов')+'.',
   'Собери страницу от обложки к действию. Убери повторяющиеся секции. Показывай непроверенные позиции, цены и фото только как примеры. Контакт владельца для переписки не публикуй.',
   'Рецензия: отдельно проверь факты и источники, пользу для посетителя, контраст, мобильную компоновку и работоспособность кнопок. Верни замечания и предложи конкретные исправления.',
  ].join('\n\n');
 }
 function audit(card,project){
  const research=requireAnalysis(card);
  const d=project.data;
  const verified=[card.name,card.city,card.category,research.publicCopy,research.verifiedItems,card.address,card.hours].filter(Boolean).join(' ').toLowerCase();
  const publicText=[d.subtitle,d.about,d.address,d.hours,d.phone,
    ...d.menu.filter(m=>!m.example).flatMap(m=>[m.name,m.description,m.price])].join(' ');
  const numeric=/\d[\d\s.,%-]*\d|\d\s*[₽%]/g;
  const suspicious=[...(publicText.match(numeric)||[])].filter(n=>!verified.includes(n.trim())&&n.trim()!==card.contact?.phone);
  const allowedPhone=String(card.contact?.phone||'').replace(/[^\d+]/g,'');
  const ownerPhone=card.owner.channel==='whatsapp'?new URL(card.owner.href).pathname.slice(1):'';
  const comparablePhone=d.phone.replace(/[^\d]/g,'');
  const ownerTelegram=card.owner.channel==='telegram'?new URL(card.owner.href).pathname.split('/')[1].toLowerCase():'';
  const ownerInCopy=ownerTelegram&&[('t.me/'+ownerTelegram),('@'+ownerTelegram)].some(x=>publicText.toLowerCase().includes(x));
  const privacy=!ownerInCopy&&(card.owner.channel!=='vk'||!publicText.toLowerCase().includes(card.owner.href.slice(8).toLowerCase()))&&!(ownerPhone&&publicText.replace(/\D/g,'').includes(ownerPhone))&&
    (card.owner.channel!=='email'||!publicText.toLowerCase().includes(card.owner.href.slice(7).toLowerCase()))&&
    (!d.phone||String(d.phone).replace(/[^\d+]/g,'')===allowedPhone||
      comparablePhone.length>=8&&research.publicCopy.replace(/\D/g,'').includes(comparablePhone));
  const rgb=d.color.match(/[a-f0-9]{2}/gi).map(v=>Number.parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);
  const luminance=rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722;
  const contrast=1.05/(luminance+.05);
  const target=d.target==='contacts'?'contacts':'menu';
  const usable=d.blocks.includes('cover')&&d.blocks.includes(target)&&d.action.trim()!==''&&
   (target!=='menu'||d.menu.some(m=>m.name.trim()));
  return [
   {label:'Анализ',ok:project.research===key(card),hint:'Анализ или контакт изменился. Обновите проект по актуальному анализу.'},
   {label:'Факты',ok:!suspicious.length,hint:'В тексте есть числа без подтверждения в анализе. Сверьте факты и цены либо пометьте позиции как пример.'},
   {label:'Приватность',ok:privacy,hint:'Удалите личный контакт владельца и оставьте только подтверждённый рабочий телефон заведения.'},
   {label:'Действие',ok:usable,hint:'Добавьте обложку и блок, на который ведёт кнопка. Для меню нужна хотя бы одна позиция.'},
   d.design?{label:'Индивидуальный макет',ok:designIsComplete(d,d.design),hint:'После правок макету недостаёт блока. Пересоберите дизайн.'}:
    {label:'Читаемость',ok:contrast>=4.5,hint:'Цвет обложки слишком светлый для белого текста. Выберите более тёмный оттенок.'},
  ];
 }
 function critiqueBrief(card,project){
  const d=project.data;
  const data=project.kind==='generated'?{
   title:d.title,subtitle:d.subtitle,publicText:d.about,blocks:d.blocks,
   target:d.target,button:d.action,color:d.color,menu:d.menu.map(({image,...item})=>item),
   ...(d.design?{direction:d.design.direction,layout:d.design.markup.slice(0,1300),styles:d.design.css.slice(0,650)}:{}),
  }:{title:d.title,reference:d.source||'HTML из редактора'};
  return [
   'Проведи независимую рецензию демосайта. Проверь рендер или HTML, если он приложен. Не считай результат проверенным без просмотра.',
   'Текущий черновик\n'+JSON.stringify(data,null,2),
   prompt(card),
   'Раздели результат на проверки фактов и источников, дизайна и сценария, мобильной доступности. Укажи, что подтвердилось, что исправить и что невозможно проверить по имеющимся данным.',
  ].join('\n\n');
 }
 return {owner,analysis,sampleAnalysis,key,requireAnalysis,prompt,audit,critiqueBrief,https,yandexPlace,venuePhoto};
})();

   const key=localKey(v,from), ext=key.split('.').pop().toLowerCase();

  for(const x of doc.querySelectorAll('style'))x.textContent=rewriteCSS(x.textContent,entry).replace(/<\/style/gi,'<\\/style');

   for(const {name,value} of [...x.attributes]){
    if(name.startsWith('on')||['srcset','ping','formaction','action','srcdoc'].includes(name))x.removeAttribute(name);
    else if(name==='src'||name==='poster'){const asset=dataAsset(value,entry);if(asset)x.setAttribute(name,asset);else x.removeAttribute(name);}
    else if(name==='href'||name==='xlink:href'){

   const excluded=s.cards.filter(c=>c.fixture&&c.bucket==='excluded'&&c.site);
   let restored=0;
   for(const c of excluded){checkCard(c);change(c);if(c.bucket==='parser')restored++;}
   return {checked:excluded.length,restored,unknown:0};
  }
  m=path.match(/^card\/(\d+)(?:\/(\w+))?$/);
  if(m)return cards(s,m[1],m[2],b);
  if(path==='project/create')return projectCreate(s,b);
  m=path.match(/^project\/(\d+)(?:\/(\w+))?$/);
  if(m)return projects(s,m[1],m[2],b);
  if(path==='settings'){
   for(const k of Object.keys(defaultSettings))if(Object.hasOwn(b,k))s.settings[k]=typeof defaultSettings[k]==='boolean'?!!b[k]:text(b[k]);
   s.settings.provider='local';return s.settings;
  }
  if(path==='users')return [{id:1,nick:s.settings.name||'Оператор',online:true}];
  if(path==='openings')return {items:[{title:'Открылась пиццерия PizzaSun в Иркутске',link:'',name:'PizzaSun',city:'Иркутск'}],errors:[],checked:date()};
  throw issue('Действие недоступно в локальной версии.',404);
 }
 function api(path,data){
  return enqueue(async ()=>{
   const s=await storage();
   const progressed=['job','state'].includes(path)&&processJob(s);
   const value=await route(s,path,data);
   if(data!==undefined||progressed)await storage(s);
   return value;
  });
 }
 function showShared(){
  const cloudKey=new URLSearchParams(location.search).get('demo');
  if(cloudKey===null&&!location.hash.startsWith('#demo='))return false;
  document.title='Демосайт · Контур';
  const root=document.getElementById('app');

   let shared;

    root.textContent='Загружаем демосайт…';

    if(!response.ok)throw issue('Страница не найдена или временно недоступна.');
    shared={site:unpackSite(await response.text()),token:cloudKey};
   }else shared=readShared();
   if(!shared)throw issue('Некорректный адрес демо.');
   document.title=shared.site.title;
   root.innerHTML='<iframe class="shared-site" title="Демосайт" sandbox="allow-popups allow-popups-to-escape-sandbox allow-top-navigation-to-custom-protocols"></iframe>';
   root.firstElementChild.srcdoc=renderSite(shared.site);
   if(location.origin==='https://nekovvork.ru'&&/^[a-f0-9]{32}$/.test(shared.token)){
    const key='kontur-open:'+shared.token;
    let seen=false;
    try{seen=!!sessionStorage.getItem(key);}catch{}
    if(!seen){
     fetch('https://kontur-ai.nekolov02.workers.dev/d/'+shared.token+'/view',{method:'POST',keepalive:true,credentials:'omit'})
      .then(response=>{if(response.ok)sessionStorage.setItem(key,'1');}).catch(()=>{});
    }
   }else opening(shared.token).catch(()=>{});
  }
  draw().catch(error=>{
   root.innerHTML='<main class="wait"><h1>Демосайт недоступен</h1><p>'+esc(error.message)+'</p><a href="'+esc(location.pathname)+'">Открыть Контур</a></main>';
  });
  return true;
 }
 return {api,showShared,matchingDemo,requireMessage};
})();

<script>
'use strict';

const defaultAiEndpoint = {
 'https://nekovvork.ru':'https://kontur-ai.nekolov02.workers.dev/ai',
 'http://127.0.0.1:8790':'http://127.0.0.1:8791/ai',
}[location.origin]||'';
const aiConfig = {
 endpoint: defaultAiEndpoint,
 code: '',
};
try {
 aiConfig.endpoint=localStorage.getItem('kontur-ai-endpoint')||defaultAiEndpoint;
 aiConfig.code=sessionStorage.getItem('kontur-ai-code')||'';
}catch{}

function aiEndpoint(value){
 try{
  const url=new URL(value);
  const loopback=location.protocol==='http:'&&['127.0.0.1','localhost'].includes(location.hostname)&&
   ['127.0.0.1','localhost'].includes(url.hostname);
  if(url.username||url.password||url.search||url.hash||!(url.protocol==='https:'||loopback&&url.protocol==='http:'))throw new Error();
  if(url.pathname==='/')url.pathname='/ai';
  if(url.pathname==='/ai')return url.href;
 }catch{}
 throw new Error('Укажите HTTPS-адрес сервера с путём /ai.');
}
async function aiRequest(data,config=aiConfig){
 let response;
 try{
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),65000);
  try{
   response=await fetch(config.endpoint,{
    method:'POST',headers:{Authorization:'Bearer '+config.code,'Content-Type':'application/json'},
    body:JSON.stringify(data),credentials:'omit',redirect:'error',cache:'no-store',signal:controller.signal,
   });
   const result=await response.json();
   if(response.ok&&result&&typeof result==='object')return result;
   if(typeof result?.error==='string')throw new Error(result.error);
  }finally{clearTimeout(timer);}
 }catch(error){
  if(error.name==='AbortError')throw new Error('ИИ не успел ответить. Повторите запрос.');
  if(!(error instanceof TypeError||error instanceof SyntaxError))throw error;
 }
 throw new Error('Сервер ИИ недоступен. Проверьте адрес и разрешённый домен приложения.');
}

  }else if(phones.length&&['telegram','whatsapp'].includes(channel)){

 }).join('')}</ul></div>`;

 return `<div class="sheet stack call-verification"><strong>Требуется звонок для сверки</strong>

function aiShow(result,mode,node){

 const links=sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title||new URL(s.url).hostname)}</a>${s.cited?'':' <small>· проверьте ссылку из ответа ИИ</small>'}</li>`).join('');

 const business=result.business;

 const registrySource=workflow.https(business?.registrySource);
 const legal=businessSource&&/^\d{10}(?:\d{2})?$/.test(business.inn)?`<details data-key="business"><summary>Реквизиты и подтверждение роли</summary><div class="stack">
  <div>${business.name?`<b>${esc(business.name)}</b> · `:''}ИНН ${esc(business.inn)} · <a href="${esc(businessSource)}" target="_blank" rel="noopener noreferrer">Связь с заведением</a></div>

 </div></details>`:'';

 }).join('');
 const contactItems=contactList(contacts.filter(item=>item.channel!=='phone'&&!messengerNames[item.channel]));
 const phones=contactList(contacts.filter(item=>item.channel==='phone'));
 const website=workflow.https(result.website?.site);
 const passes=Array.isArray(result.coverage)?result.coverage:[];
 const needsCall=mode==='owner'&&!aiOwnerOptions(result,model.selected).length;
 const coverage=passes.map(pass=>
  `<li>${esc(pass.label)} · ${pass.completed?'поиск завершён':esc(pass.error||'поиск не завершён')}${Array.isArray(pass.platforms)?`<small> · ${esc(pass.platforms.length?pass.platforms.join(', '):'поисковик не указал площадки') }</small>`:''}</li>`).join('');
 const warnings=(Array.isArray(result.warnings)?result.warnings:[]).filter(warning=>typeof warning==='string');
 const reviewable=mode==='owner'?own:mode==='analysis'?sources.length&&researchFields.some(([key])=>result.analysis?.[key]):result.comments;
 node.innerHTML=`<section class="sheet stack ${mode==='owner'?'owner-report':''}">
  ${mode!=='owner'&&result.summary?`<p>${esc(result.summary)}</p>`:''}
  ${mode==='owner'?`${website?`<p>У заведения уже есть <a href="${esc(website)}" target="_blank" rel="noopener noreferrer">свой сайт</a>.</p>`:''}
  ${!needsCall||person?candidate:''}

  ${reviewable?btn(aiOwnerSelection()?.key==='person'?'Контакт владельца выбран':'Выбрать контакт владельца','ai-pick-contact','tint','data-v="person"'):''}
  ${needsCall?`<details data-key="messenger-checks"><summary>Проверка мессенджеров</summary>${aiMessengerLinks(contacts,passes)}</details>`:aiMessengerLinks(contacts,passes)}
  ${contactItems?`<div><strong>Каналы заведения</strong><p class="muted">Здесь можно узнать, с кем обсуждать сотрудничество.</p><ul class="ai-sources">${contactItems}</ul></div>`:''}

  ${mode==='analysis'&&!reviewable?'<p class="muted">Поиск не вернул достаточно данных с источниками.</p>':''}
  ${reviewable&&mode!=='owner'?btn({analysis:'Заполнить черновик анализа',review:'Подставить рецензию'}[mode],'ai-apply','','data-v="'+mode+'"'):''}

async function aiStart(mode){
 if(!aiConfig.endpoint||!aiConfig.code){
  showModal('ai-settings',{back:model.modal});
  return;
 }
 const modal=model.modal;
 const card=model.selected;
 const node=el('[data-ai-result]');
 if(!modal||!node||modal.aiPending)return;
 if(mode!=='review'&&(!card||card.fixture))throw new Error('Анализ ИИ доступен для реальных заведений.');
 modal.aiPending=mode;
 delete modal.aiResult;
 delete modal.aiContactKey;
 delete modal.aiError;
 aiOwnerFooter();
 node.textContent=aiPendingText(mode);
 const venue=card?{name:card.name,city:card.city,address:card.address,category:card.category,site:card.site,map:workflow.yandexPlace(card.map_url)}:null;
 try{
  const result=await aiRequest(mode==='review'?{mode,brief:modal.brief}:{mode,venue});
  if(model.modal!==modal||mode!=='review'&&model.selected?.pid!==card.pid)return;
  modal.aiResult={mode,result};
  if(mode==='owner'&&aiOwnerSelection()&&!modal.ownerScratch){
   const fields=el('.owner-form-section');if(fields)fields.open=false;
  }
  const current=el('[data-ai-result]');
  if(current)aiShow(result,mode,current);
  if(mode==='owner')aiOwnerFooter();
 }catch(error){
  if(model.modal!==modal)return;
  modal.aiError=error.message;
  const current=el('[data-ai-result]');
  if(current)current.textContent=modal.aiError;
 }finally{modal.aiPending=false;}
}
async function generateAiDraft(){
 const card=model.selected;
 if(!card)return;
 const stage=model.stage;
 const fallback=()=>updateCard('generate',{stage,variant:++model.variant},card);
 const url=localApi.matchingDemo(card,model.state.projects);
 if(!url||card.fixture||!aiConfig.endpoint||!aiConfig.code)return fallback();
 const existing=draftInput();
 const cfg=model.state.settings;
 notify('Gemini готовит черновик…');
 let result;
 try{
  result=await aiRequest({mode:'draft',venue:{name:card.name,city:card.city,category:card.category},
   draft:{opportunity:card.analysis.opportunity,publicCopy:card.analysis.publicCopy,offer:cfg.offer,language:cfg.lang}});
 }catch{
  if(model.selected?.pid===card.pid&&model.selected.version===card.version&&model.stage===stage&&draftInput()===existing){
   if(!existing.trim())await fallback();
   notify(existing.trim()?'Gemini недоступен. Предыдущий черновик сохранён.':'Gemini недоступен. Подставлен шаблон «Контура».');
  }
  return;
 }
 if(model.selected?.pid!==card.pid||model.selected.version!==card.version||model.stage!==stage||draftInput()!==existing)return;
 const body=String(result.draft||'').trim();
 if(!body)throw new Error('Gemini вернул пустой черновик.');
 const message=localApi.requireMessage(body+'\n'+url,url);
 await updateCard('draft',{stage,text:message},card);
 notify('Черновик Gemini готов.');
}
function aiApply(mode){
 const saved=model.modal?.aiResult;
 if(!saved||saved.mode!==mode)return;
 const {result}=saved;
 const form=el(`form[data-form="${mode==='analysis'?'research':mode==='review'?'agent-review':'owner'}"]`);
 if(!form)return;
 const fill=(name,value)=>{if(form.elements[name]&&typeof value==='string')form.elements[name].value=value;};
 if(mode==='owner'){
  if(!result.owner)return;
  const {name,channel,contact,url}=result.owner;
  fill('name',name);fill('channel',channel);fill('contact',contact);fill('source',workflow.https(url));
  form.elements.confirmed.checked=false;
  form.closest('details').open=true;
  rememberOwnerForm(form);
 }else if(mode==='analysis'){
  if(!result.analysis)return;
  for(const [key] of researchFields)if(result.analysis[key])fill(key,result.analysis[key]);
  for(const key of ['cta','target','verifiedItems'])if(result.analysis[key])fill(key,result.analysis[key]);
  const urls=Array.isArray(result.sources)?result.sources.map(s=>workflow.https(s.url)).filter(Boolean):[];
  fill('sources',[...new Set([...urls,...form.elements.sources.value.split('\n').filter(Boolean)])].slice(0,12).join('\n'));
 }else fill('comments',result.comments);
 form.elements[mode==='owner'?'name':mode==='analysis'?'audience':'comments']?.focus();
 notify(mode==='review'?'Рецензия добавлена в форму.':'Проверьте данные и сохраните форму.');
}
async function aiConnect(data){
 const modal=model.modal;
 const code=String(data.code||'').trim();
 if(!/^[a-f0-9]{32,128}$/i.test(code))throw new Error('Проверьте код доступа к ИИ.');
 const config={endpoint:aiEndpoint(data.endpoint),code};
 const result=await aiRequest({mode:'check'},config);
 if(result.ok!==true)throw new Error('Сервер не подтвердил подключение.');
 Object.assign(aiConfig,config);
 try{
  localStorage.setItem('kontur-ai-endpoint',config.endpoint);
  sessionStorage.setItem('kontur-ai-code',config.code);
 }catch{}
 if(model.modal===modal){
  model.modal=modal.back||null;renderOverlay();
  if(modal.onConnect)await modal.onConnect();
 }
 notify('Сервер ИИ подключён.');
}

function timeline(events){
 const names={owner_confirmed:'Контакт владельца подтверждён',venue_contact_confirmed:'Канал заведения подтверждён',analysis_saved:'Анализ сохранён',chat_opened:'Чат открыт',incoming:'Получен ответ',sent:'Пользователь отметил отправку',confirmed:'Отправка подтверждена интеграцией',draft_created:'Черновик создан',draft_saved:'Черновик сохранён',claimed:'Добавлено в Базу',status:'Статус изменён',updated:'Карточка изменена',undo:'Перенос отменён',follow_scheduled:'Напоминание запланировано'};
 return `<div class="timeline">${events.map(e=>{
 let message=e.text;
 if(e.kind==='chat_opened'){try{const d=JSON.parse(e.text);message=d.channel+(d.text?'\n'+d.text:'');}catch{}}
 return `<article><div class="spread"><strong>${esc(names[e.kind]||e.kind)}</strong><small>${fmt(e.time)}</small></div>${message?`<p>${esc(message)}</p>`:''}</article>`;
 }).join('')||'<p class="muted">История пока пуста.</p>'}</div>`;
}

function renderOverlay(){

 const drawerScroll=renderedCard===model.selected?.pid?el('.drawer-body',root)?.scrollTop||0:0;
 const dialogScroll=renderedModal===model.modal?el('.owner-dialog-body, .dialog:not(.owner-dialog)',root)?.scrollTop||0:0;
 root.innerHTML=(model.selected?cardView(model.selected):'')+(model.modal?modalView(model.modal):'');
 restoreAiOutput(root,model.modal);
 aiOwnerFooter();
 for(const d of all('.dialog details[data-key]',root))if(tabs?.has(d.dataset.key))d.open=tabs.get(d.dataset.key);
 renderedModal=model.modal;renderedCard=model.selected?.pid;
 if(el('.drawer-body',root))el('.drawer-body',root).scrollTop=drawerScroll;
 const scroller=el('.owner-dialog-body, .dialog:not(.owner-dialog)',root);
 if(scroller)scroller.scrollTop=dialogScroll;
 const frame=el('.demo-frame',root);
 if(frame&&model.editor?.preview)frame.srcdoc=model.editor.preview;
 const tg=telegramApp();
 if(tg?.BackButton){if(model.selected||model.modal)tg.BackButton.show();else tg.BackButton.hide();}
 if(el('[data-select]',root))el('[data-select]',root).select();
 document.body.classList.toggle('modal-open',!!(model.selected||model.modal));
 const shell=el('.app-shell');
 if(shell)shell.inert=!!(model.selected||model.modal);

 if(drawer)drawer.inert=!!model.modal;

const requestedPhotos=new Set();
async function fillCardPhoto(card){
 const map=workflow.yandexPlace(card.map_url);
 if(card.photo||!map||!aiConfig.code||requestedPhotos.has(map))return;
 requestedPhotos.add(map);
 try{
  const result=await aiRequest({mode:'place-photo',map});
  const photo=workflow.venuePhoto(result.photo);
  if(!photo)return;
  const changed=await api('card/photo',{pid:card.pid,map,photo});
  if(model.selected?.pid===card.pid){
   model.selected={...model.selected,photo:changed.photo};
   if(!model.modal)renderOverlay();
  }
  await refresh();
 }catch{requestedPhotos.delete(map);}
}

function draftInput(){return el('#draft')?.value??model.cardScratch??model.selected?.drafts[model.stage]??'';}
async function copyText(value,fallback=true){
 if(!value){notify('Текст для копирования пуст.');return false;}
 try{await navigator.clipboard.writeText(value);return true;}
 catch{
  if(fallback)showModal('copy',{value});
  return false;
 }
}
function openTelegramLink(href){
 const app=telegramApp();
 if(!app)return false;
 const url=safeLink(href);
 if(!url)return false;
 try{
  const method=new URL(url).hostname==='t.me'?'openTelegramLink':'openLink';
  if(typeof app[method]!=='function')return false;
  app[method](url);
  return true;
 }
 catch{return false;}
}
async function openChannel(name,fallback=false){
 const card=model.selected;
 const entry=channels(card).find(([n])=>n===name);
 if(!entry)return;
 const href=entry[1];
 const message=localApi.requireMessage(draftInput(),localApi.matchingDemo(card,model.state.projects));
 const training=card.owner.channel==='test';
 const tg=telegramApp()&&safeLink(href)&&!fallback;
 const popup=training||tg||fallback?null:window.open('about:blank','_blank');
 if(!training&&!tg&&!popup&&!fallback){
  model.externalFallback={name};renderOverlay();return;
 }
 if(popup)popup.opener=null;
 const copy=copyText(message,false);
 try{
  const moved=card.bucket!=='base';
  await updateCard('chat',{text:message,href,channel:name},card);
  const copied=await copy;
  if(moved){model.tab='base';model.section='base';model.status='';model.filter='';model.q='';render();}
  model.externalFallback=null;
  if(training)showModal('test-chat',{value:message,copied});
  else if(popup)popup.location.href=href;
  else if(!tg||!openTelegramLink(href))location.href=href;
  if(!training)renderOverlay();
  notify(copied?'Сообщение с демо скопировано.':'Сообщение с демо доступно в карточке.');
 }catch(error){popup?.close();throw error;}
}

function toggleChoice(list,value,add){
 const x=value.trim();
 if(!x)return list;
 const exists=list.find(v=>split(v)===split(x));
 if(add&&exists)return list;
 if(exists)return list.filter(v=>v!==exists);
 if(list.length>=10){notify('Можно добавить не больше 10 значений.');return list;}
 return [...list,x];
}
async function searchMaps(data){
 const state=model.mapSearch;
 if(state.pending)return;
 const city=data.city.trim(),query=data.query.trim();
 if(!city||!query)throw new Error('Введите город и категорию или название заведения.');
 Object.assign(state,{city,query,error:'',result:null,incomplete:false});
 if(!aiConfig.endpoint||!aiConfig.code){render();showModal('ai-settings',{onConnect:()=>searchMaps({city,query})});return;}
 state.pending=true;
 render();
 try{
  const found=await aiRequest({mode:'places',venue:{name:query,city}});
  state.result=(Array.isArray(found.places)?found.places:[]).filter(place=>place?.name&&place?.address&&workflow.yandexPlace(place.map_url));
  if(state.result.some(place=>place.network_url)){
   await api('card/sync-sites',{places:state.result.filter(place=>place.network_url)});
   await refresh(false);
  }
  state.incomplete=found.siteCheckIncomplete===true;
 }catch(error){state.error=error.message;}
 finally{state.pending=false;if(model.section==='search'&&!model.training)render();}
}

async function prepareProposal(){
 const card=model.selected;
 workflow.requireAnalysis(card);
 const individual=liveDesign(card);
 if(individual&&(!aiConfig.code||!aiConfig.endpoint)){
  showModal('ai-settings',{back:model.modal,onConnect:prepareProposal});
  return;
 }
 let draft=await api('project/create',{kind:'generated',pid:card.pid,style:'Современный'});
 if(model.selected?.pid!==card.pid)return;
 model.editor=draft;
 model.editorDirty=false;
 showModal('quick-proposal',{pending:true,individual,designing:individual&&!draft.individual});
 const modal=model.modal;
 try{
  if(modal.designing)draft=await designProject(card,draft);
  const reviewed=await api('project/'+draft.id+'/review',{version:draft.version});
  if(model.modal!==modal)return;
  model.editor=reviewed;
  modal.designing=false;
  renderOverlay();
  if(reviewed.feedback||!aiConfig.code||!aiConfig.endpoint||!reviewed.review.checks.every(check=>check.ok))return;
  const {comments}=await aiRequest({mode:'review',brief:workflow.critiqueBrief(card,reviewed)});
  if(!comments)throw new Error();
  if(model.modal===modal)model.editor=await api('project/'+draft.id+'/feedback',{version:draft.version,comments});
 }catch(error){
  modal.error=modal.designing?error.message:'Рецензия ИИ недоступна. Проверьте предпросмотр и результаты проверок вручную.';
 }finally{
  modal.pending=false;
  modal.designing=false;
  if(model.modal===modal)renderOverlay();
 }
}
function readEditor(form=el('#editor-form')){
 if(!form)return model.editor.data;
 const f=new FormData(form), data={...model.editor.data};
 for(const k of ['title','subtitle','about','image','color','action','address','hours','phone','target'])data[k]=String(f.get(k)||'');
 data.example=f.has('example');
 data.blocks=[...data.blocks,...Object.keys(BLOCKS).filter(k=>!data.blocks.includes(k))].filter(k=>f.has('block-'+k));
 data.menu=data.menu.map((_,i)=>Object.fromEntries(['category','name','price','description','image','example'].map(k=>[k,k==='example'?f.has(`menu-${i}-${k}`):String(f.get(`menu-${i}-${k}`)||'')])));
 return data;
}

  if(key!==draft.key)throw new Error('Сервер не подтвердил публикацию. Повторите попытку.');
 }
 const publication=await api('project/'+p.id+'/publish',{version:p.version,key});
 if(model.modal===modal)model.editor=publication;
 if(model.selected?.pid===publication.pid)model.selected=await api('card/'+publication.pid);
 await refresh();
 if(quick&&model.modal===modal&&model.selected?.pid===publication.pid&&publication.url){
  closeModal();
  const saved=draftInput();
  if(!saved.trim()){
   await updateCard('generate',{},model.selected);
  }else if(!saved.split(/\s+/).includes(publication.url)){
   const message=p.url&&saved.split(/\s+/).includes(p.url)?saved.replace(p.url,publication.url):saved.trim()+'\n'+publication.url;
   await updateCard('draft',{text:message},model.selected);
  }
  notify(publication.cloud?'Демоссылка и черновик готовы.':'Черновик готов. Открытия доступны только на этом устройстве.');
  return;
 }
 if(model.modal===modal)renderOverlay();
 notify(publication.cloud?'Ссылка готова. Открытия считаются на сервере.':publication.url?'Ссылка готова.':'Демо сохранено. Доступен экспорт HTML.');
}
async function encodeFiles(files,folder){
 const list=[...files];
 if(!list.length)throw new Error('Выберите HTML, ZIP или папку.');
 if(list.length>200||list.reduce((n,f)=>n+f.size,0)>5000000)throw new Error('Размер больше 5 МБ или 200 файлов.');
 return Promise.all(list.map(file=>new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve({name:folder?file.webkitRelativePath||file.name:file.name,data:String(reader.result).split(',')[1]});
  reader.onerror=()=>reject(new Error('Файл не удалось прочитать.'));
  reader.readAsDataURL(file);
 })));
}

async function run(control,action){
 if(control?.disabled)return;
 if(control?.tagName==='BUTTON')control.disabled=true;
 try{await action();}
 catch(error){problem(error);}
 finally{if(control?.tagName==='BUTTON'&&control.isConnected)control.disabled=false;}
}

 }
 if(n.dataset.a==='open-ai-channel'){
  if(openTelegramLink(n.href))event.preventDefault();
  return;
 }
 const act=actions[n.dataset.a];
 if(!act)return;
 if(!['retry-channel','open-site-link'].includes(n.dataset.a))event.preventDefault();
 if(n.dataset.a==='open-site-link'&&openTelegramLink(n.href))event.preventDefault();
 run(n,()=>act(n));
});

   const [item]=await encodeFiles([file],false);

   const url='data:'+file.type+';base64,'+item.data;

   model.editor.data=draft;
   model.editorDirty=true;
   renderOverlay();
   notify('Фото добавлено. Сохраните черновик.');
  }
  if(n.id==='stage'){model.stage=n.value;model.cardScratch=null;renderOverlay();}

  if(n.id==='filter'){model.filter=n.value;render();}

   const wanted=n.value;

   if(wanted===STATUS[4])model.stage=STAGES[2];
   else if(wanted===STATUS[2])model.stage=STAGES[1];
   else if([STATUS[1],STATUS[3]].includes(wanted))model.stage=STAGES[3];

document.addEventListener('keydown',event=>{
 if(event.key==='Escape'){if(model.modal)closeModal();else if(model.selected)closeCard();return;}
 if(event.key==='/'&&!event.target.closest('input,textarea,select')&&!model.selected&&!model.modal){event.preventDefault();el('#query')?.focus();}
 if(event.altKey&&!event.target.closest('input,textarea,select')&&model.selected&&!model.modal&&['ArrowLeft','ArrowRight'].includes(event.key)){
  event.preventDefault();run(null,()=>actions.neighbor({dataset:{v:event.key==='ArrowLeft'?'-1':'1'}}));
 }
 if(event.key==='Tab'&&(model.modal||model.selected)){
  const node=el(model.modal?'.dialog':'.drawer');
  const focusable=all('a[href],button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),summary,iframe',node).filter(n=>n.getClientRects().length);
  const first=focusable[0],last=focusable.at(-1);
  if(event.shiftKey&&document.activeElement===first&&last){event.preventDefault();last.focus();}
  else if(!event.shiftKey&&document.activeElement===last&&first){event.preventDefault();first.focus();}
 }
});
let polling=false;
async function tick(){
 if(polling||!model.state?.user||document.hidden)return;
 polling=true;
 try{
  const current=model.state.job;
  if(current&&['running','scouting','scheduled'].includes(current.state)){
   const next=await api('job');
   if(model.state.job?.id!==current.id||model.state.job?.state!==current.state)return;
   if(next&&next.state!==current.state){
    await refresh();
   }else if(next){
    model.state.job=next;
    const box=el('#jobbox');
    if(box)box.innerHTML=jobView(next);
   }
  }
 }catch(error){if(error.status===401){await refresh();closeCard();closeModal();}}
 finally{polling=false;}
}

 try{
  await refresh();
  setInterval(tick,650);

 }catch(error){
  el('#app').innerHTML=`<div class="wait"><h1>Контур</h1><p>${esc(error.message)}</p><a href="/">Попробовать снова</a></div>`;
 }
}
